[project]
name = "rm27-astra"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.6,<4"]

[project.optional-dependencies]
vision = ["mujoco>=3.2,<4", "opencv-python>=4.6,<5"]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["astra"]

[tool.setuptools.package-dir]
astra = "."

[tool.setuptools.package-data]
astra = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:ament_xmllint -p no:ament_copyright -p no:launch_ros -p no:launch_testing -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint"
