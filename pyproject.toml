[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rm27-contact-rl"
version = "0.1.0"
description = "Minimal state-based MuJoCo contact and recovery environment for RM27"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rm27-contact-physics==0.1.0",
    "gymnasium>=1,<2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
# Optional experiment tracking (W&B); imported only when a run enables it.
tracking = ["wandb==0.31.0"]
# First PPO closure is CPU-only, CPython 3.12 on Linux amd64, matching Docker.
# Direct official wheel prevents the ordinary PyPI Torch CUDA distribution.
train = [
    "stable-baselines3==2.9.0",
    "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.14.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=5a6363570c753812540a05eb82380e329469cbe668643e88111414c12627711f",
]

# One third-party lock also includes this editable build backend.
[dependency-groups]
build = ["setuptools==82.0.1"]

[tool.setuptools]
packages = ["rm27_contact_rl"]
include-package-data = false

[tool.setuptools.package-dir]
rm27_contact_rl = "src/rm27_contact_rl"

# Lock resolution reads the local first-party project; it is installed separately.
[tool.uv.sources]
rm27-contact-physics = { path = "packages/physics" }
